name: Generate profile metrics

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Profile overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.github.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_affiliations: owner, organization_member, collaborator
          config_twemoji: yes

      - name: Most-used languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_details: percentage
          plugin_languages_categories: programming, markup
          plugin_languages_colors: github
          plugin_languages_ignored: HTML, CSS

      - name: Recent public and private activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.activity.svg
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 12
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_visibility: all

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Code volume
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.lines.svg
          base: ""
          plugin_lines: yes
          plugin_lines_sections: base

      - name: Repository telemetry
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.repositories.svg
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Coding habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.habits.svg
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: Asif2902
          template: classic
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
